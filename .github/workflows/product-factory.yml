name: Product factory checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: product-factory-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate single public catalog
        run: python factory/product_factory.py validate
      - name: Run factory tests (synthetic fixtures only)
        run: python -m unittest discover -s factory/tests -v
      - name: Render static product catalog
        run: python factory/product_factory.py render-catalog
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:physics
      - run: npm run build
      - name: Install Chromium for bounded browser checks
        run: npx playwright install --with-deps chromium
      - name: Product and orbital browser checks
        run: npx playwright test tests/products.spec.ts tests/orbital.spec.ts --config playwright.ci.config.ts --workers=1
